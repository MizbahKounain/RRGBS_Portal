<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f2326" />
      <stop offset="70%" stop-color="#121416" />
      <stop offset="100%" stop-color="#0a0b0c" />
    </radialGradient>

    <!-- Emerald Glow Center Gradient -->
    <radialGradient id="greenGlow" cx="48%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#22ff6b" />
      <stop offset="25%" stop-color="#00d84f" />
      <stop offset="65%" stop-color="#008a32" />
      <stop offset="92%" stop-color="#004a1b" />
      <stop offset="100%" stop-color="#002b0f" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f45" />
      <stop offset="50%" stop-color="#1c2024" />
      <stop offset="100%" stop-color="#2a2e34" />
    </linearGradient>

    <!-- Circular Text Path (Clockwise from top) -->
    <!-- Center (100, 100), radius 73 -->
    <path id="circlePath" d="M 100, 27 a 73,73 0 1,1 -0.01,0" fill="none" />

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Rounded Badge -->
  <rect x="2" y="2" width="196" height="196" rx="20" fill="url(#bgGrad)" stroke="#2d3238" stroke-width="3" />

  <!-- Outer Fine Accent Border -->
  <rect x="8" y="8" width="184" height="184" rx="16" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.15" />

  <!-- Circular Outer Track for Text -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#25292e" stroke-width="1.5" />
  <circle cx="100" cy="100" r="58" fill="none" stroke="#00d84f" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ambient Green Halo behind center sphere -->
  <circle cx="100" cy="100" r="56" fill="#00d84f" opacity="0.25" filter="url(#softGlow)" />

  <!-- Glowing Emerald Center Disc -->
  <circle cx="100" cy="100" r="53" fill="url(#greenGlow)" stroke="#003512" stroke-width="2" />

  <!-- Specular highlight arc on sphere -->
  <ellipse cx="96" cy="68" rx="28" ry="12" fill="#ffffff" opacity="0.12" />

  <!-- Circular Rotating/Tracked Brand Text: "...GROUP OF BUSINESS SOLUTIONS..." -->
  <text fill="#ffffff" font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="13" letter-spacing="2.8px">
    <textPath href="#circlePath" startOffset="50%" text-anchor="middle">
      ••• GROUP OF BUSINESS SOLUTIONS •••
    </textPath>
  </text>

  <!-- Large Bold White Centered Letters "RR" -->
  <text x="100" y="119" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', 'Impact', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="-1px" style="filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));">
    RR
  </text>
</svg>
